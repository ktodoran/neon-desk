name: Demo

# Publishes examples/widget to GitHub Pages: the widget in demo mode, with
# scripted answers, so it can be tried without a server or a model.
on:
  push:
    branches: [main]
    paths:
      - widget/**
      - examples/widget/**
      - src/llm/sse.ts
      - .github/workflows/demo.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx esbuild widget/src/index.ts --bundle --format=iife --minify --target=es2022 --outfile=examples/widget/neon-desk.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples/widget

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
